[project]
name = "entsent"
version = "0.1.0"
description = "Entity-level sentiment: per-entity vs single-pass encoders vs an LLM baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=2.2",
    "protobuf>=7.36.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
]
serve = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
default-groups = ["dev", "serve"]  # CI runs the API tests; the Docker image installs serve only

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entsent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "yaml"]
ignore_missing_imports = true

# transformers is largely unannotated; treat it as Any instead of failing strict mode.
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
follow_imports = "skip"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
