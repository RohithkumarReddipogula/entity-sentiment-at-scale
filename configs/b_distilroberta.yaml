# Model B (per-entity encoder) on distilroberta-base. Used for the M2 encoder check.
name: b_distilroberta
architecture: per_entity
encoder:
  name: distilbert/distilroberta-base  # Apache-2.0
  revision: fb53ab8802853c8e4fbdbcd0529f21fc6f459b2b
max_length: 128
optim:
  epochs: 3
  batch_size: 32
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  dropout: 0.1
seed: 1
device: auto
save_checkpoint: false
